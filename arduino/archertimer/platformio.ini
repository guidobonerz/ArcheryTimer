; Builds the sketch as it lies here, the Arduino IDE keeps working next to it.
;   pio run                build
;   pio run -t upload      build and flash
;   pio device monitor     log of the usb socket

[platformio]
src_dir = .

[env:archertimer]
; esp32 core 3.3.x, the line the Arduino IDE builds this sketch with - the
; platform of the PlatformIO registry stops at 2.x. Pinned, not "stable":
; that is core 4.x by now, which Adafruit Protomatter 1.7.1 does not build
; against (driver/periph_ctrl.h is gone).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
; Adafruit MatrixPortal S3: 8MB flash, 2MB psram, HUB75 socket on the pins the
; sketch names
board = adafruit_matrixportal_esp32s3
framework = arduino

; src_dir is the project folder, so the libraries PlatformIO fetches lie in it
build_src_filter = +<*> -<.pio/>

; the versions the sketch was last built with in the Arduino IDE
lib_deps =
  adafruit/Adafruit Protomatter@^1.7.1
  adafruit/Adafruit GFX Library@^1.13.0
  bblanchon/ArduinoJson@^7.4.3
  powerbroker2/DFPlayerMini_Fast@^1.2.4

monitor_speed = 115200
