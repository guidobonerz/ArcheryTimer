; Builds the sketch as it lies here, the Arduino IDE keeps working next to it.
;   pio run                build
;   pio run -t upload      build and flash
;   pio device monitor     log of the socket marked UART

[platformio]
src_dir = .

[env:touchcontroller]
; esp32 core 3.3.x - the platform of the PlatformIO registry stops at 2.x, which
; lacks the rgb panel driver this sketch uses. The same release as in
; ../archertimer: two releases share one folder of toolchain and framework,
; and every build of the other project would fetch and unpack them anew.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Waveshare ESP32-S3-Touch-LCD-7: 8MB flash, 8MB octal psram
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

; the lvgl settings are those of build_opt.h, which only the Arduino IDE reads
; LVGL draws in software, which gains a lot from -O2 - there is room for the
; bigger code. The Arduino IDE builds with -Os.
build_unflags = -Os
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DLV_CONF_SKIP=1
  -DLV_USE_STDLIB_MALLOC=1
  -DLV_USE_STDLIB_STRING=1
  -DLV_USE_STDLIB_SPRINTF=1
  -DLV_FONT_MONTSERRAT_20=1
  -DLV_FONT_MONTSERRAT_28=1
  -DLV_FONT_MONTSERRAT_48=1
  -DLV_THEME_DEFAULT_DARK=1
  -DLV_DEF_REFR_PERIOD=20

; src_dir is the project folder, so the libraries PlatformIO fetches lie in it
build_src_filter = +<*> -<.pio/>

lib_deps =
  lvgl/lvgl@~9.6.0
  bblanchon/ArduinoJson@^7.4.3

monitor_speed = 115200
